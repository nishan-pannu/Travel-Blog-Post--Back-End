default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  
# Add both cable AND queue configurations for production
cable:
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>

queue:
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>